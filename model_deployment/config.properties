# TorchServe Configuration File

# Socket configurations
inference_address=http://0.0.0.0:8080
management_address=http://0.0.0.0:8081
metrics_address=http://0.0.0.0:8082

# Enable CORS support
cors_allowed_origin=*
cors_allowed_methods=GET, POST, PUT, OPTIONS
cors_allowed_headers=X-Requested-With, Content-Type, Accept, Origin

# Configure default workers per model
default_workers_per_model=1

# Configure maximum request size (60MB)
max_request_size=92914560

# Configure response timeout in seconds
default_response_timeout=120

# Enable model specific custom metrics
model_metrics=True
