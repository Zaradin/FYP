version: "3"

services:
    backend:
        build: ./backend
        ports:
            - "8080:8080"
        env_file:
            - ./backend/.env
        restart: unless-stopped

    frontend:
        build: ./frontend
        ports:
            - "80:80"
        env_file:
            - ./frontend/.env
        depends_on:
            - backend
        restart: unless-stopped
